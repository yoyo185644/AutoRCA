timezone: Asia/Shanghai

index:
  type: generic_segment_index
  cache:
    enabled: true
    dir: test/cache/basil_index/frames
  build:
    bucket_size_seconds: 300
    severity_floor: 0.0
  query:
    top_k: 12
    time_tolerance_seconds: 300

paths:
  telemetry_root: dataset/{dataset}/telemetry
  query: dataset/{dataset}/query.csv
  record: dataset/{dataset}/record.csv

skill:
  evidence_sources:
    metric: true
    trace: true
    log: false
    topology: true
  modules:
    typed_channel_recall: true
    metric_reason_evidence: true
    log_reason_evidence: false
    causal_topology: true
    causal_time_selector: true
    bounded_llm_rerank: true
    trace_evidence: true
