# Market Dataset Configuration
#
# This file describes the schema for the Market (e-commerce platform)
# RCA dataset. Components, metrics, root causes, and data organization.

dataset_name: "Market"

# Data paths
data_path: "dataset/Market/metrics"
data_format: "csv"

# Sampling configuration
sampling_interval: 60  # 60 seconds default

# Topology information
has_topology: true
topology_source: "config"

# Component types in Market
components:
  - id_pattern: "cache_*"
    type: "cache"
    examples:
      - "cache_redis_1"
      - "cache_redis_2"
      - "cache_memcache_1"

  - id_pattern: "redis_*"
    type: "cache"
    examples:
      - "redis_1"
      - "redis_cluster_1"

  - id_pattern: "search_*"
    type: "search"
    examples:
      - "search_es_1"
      - "search_es_2"
      - "search_solr_1"

  - id_pattern: "es_*"
    type: "search"
    examples:
      - "es_node_1"
      - "es_node_2"

  - id_pattern: "db_*"
    type: "database"
    examples:
      - "db_mysql_master"
      - "db_mysql_slave"
      - "db_postgres_1"

  - id_pattern: "svc_*"
    type: "service"
    examples:
      - "svc_order"
      - "svc_product"
      - "svc_user"

  - id_pattern: "gateway_*"
    type: "gateway"
    examples:
      - "gateway_api"
      - "gateway_web"

# Metric groups in Market
metric_groups:
  # Cache metrics
  - name: "cache"
    patterns:
      - "cache_hit_rate*"
      - "cache_miss_rate*"
      - "cache_*"
      - "redis_*"
      - "memcache_*"
    sampling_interval_s: 60
    threshold_percentile: 0.95

  # Search metrics
  - name: "search"
    patterns:
      - "search_latency*"
      - "search_qps*"
      - "search_*"
      - "es_*"
    sampling_interval_s: 60
    threshold_percentile: 0.95

  # Database metrics
  - name: "database"
    patterns:
      - "db_query_time*"
      - "db_connection*"
      - "db_*"
      - "mysql_*"
      - "postgres_*"
    sampling_interval_s: 60
    threshold_percentile: 0.95

  # Throughput metrics
  - name: "throughput"
    patterns:
      - "qps_*"
      - "tps_*"
      - "request_*"
      - "response_time*"
      - "latency_*"
    sampling_interval_s: 60
    threshold_percentile: 0.95

  # Error metrics
  - name: "error"
    patterns:
      - "error_rate*"
      - "failure_rate*"
      - "timeout_*"
    sampling_interval_s: 60
    threshold_percentile: 0.95

# Root cause types in Market
root_cause_types:
  - "cache hit rate drop"
  - "cache memory full"
  - "search latency spike"
  - "search index corruption"
  - "database slow query"
  - "database connection pool exhausted"
  - "service timeout"
  - "service memory leak"
  - "QPS drop"
  - "cascading failure"
