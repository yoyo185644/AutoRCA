# Telecom Dataset Configuration
#
# This file describes the schema for the Telecom RCA dataset
# Components, metrics, root causes, and data organization

dataset_name: "Telecom"

# Data paths
data_path: "dataset/Telecom/telemetry"
data_format: "csv"

# Sampling configuration
sampling_interval: 60  # 60 seconds default

# Topology information
has_topology: true
topology_source: "config"  # Could be "trace", "config", or "discovery"

# Component types in Telecom
components:
  - id_pattern: "db_*"
    type: "database"
    examples:
      - "db_mysql_1"
      - "db_mysql_2"
      - "db_redis_1"

  - id_pattern: "node-*"
    type: "node"
    examples:
      - "node-1"
      - "node-2"
      - "node-server-1"

  - id_pattern: "os_*"
    type: "node"
    examples:
      - "os_node_1"
      - "os_node_2"

  - id_pattern: "docker_*"
    type: "container"
    examples:
      - "docker_app_1"
      - "docker_app_2"

  - id_pattern: "*-*"
    type: "service"
    examples:
      - "auth-service"
      - "payment-service"
      - "user-service"

# Metric groups in Telecom
metric_groups:
  # Network metrics
  - name: "network"
    patterns:
      - "network_loss*"
      - "network_latency*"
      - "network_packet*"
      - "rtt_*"
    sampling_interval_s: 60
    threshold_percentile: 0.95

  # Database metrics
  - name: "database"
    patterns:
      - "db_*"
      - "mysql_*"
      - "redis_*"
      - "connection_*"
    sampling_interval_s: 60
    threshold_percentile: 0.95

  # CPU and system metrics
  - name: "cpu"
    patterns:
      - "cpu_*"
      - "system_cpu*"
      - "load_*"
    sampling_interval_s: 60
    threshold_percentile: 0.95

  # Memory metrics
  - name: "memory"
    patterns:
      - "memory_*"
      - "ram_*"
    sampling_interval_s: 60
    threshold_percentile: 0.95

  # Application metrics
  - name: "application"
    patterns:
      - "app_*"
      - "request_*"
      - "response_*"
      - "qps_*"
      - "latency_*"
    sampling_interval_s: 60
    threshold_percentile: 0.95

# Root cause types in Telecom
root_cause_types:
  - "network loss"
  - "network delay"
  - "db connection limit"
  - "db close"
  - "CPU fault"
  - "memory fault"
  - "service timeout"
  - "cascading failure"
